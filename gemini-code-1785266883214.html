<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartsheet Calendar Generator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
    .container { max-width: 900px; margin: 0 auto; }
    textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .controls { margin: 12px 0; display: flex; gap: 12px; align-items: center; }
    button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 24px; }
    .day-header { font-weight: bold; text-align: center; padding: 8px; background: #e2e8f0; border-radius: 4px; }
    .day-card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; min-height: 70px; text-align: center; }
    .date-text { font-size: 0.85rem; color: #64748b; font-weight: 600; }
    .tag { display: inline-block; margin-top: 6px; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    .tag-All { background: #dcfce7; color: #166534; }
    .tag-NA { background: #fee2e2; color: #991b1b; }
    .tag-Night, .tag-Overnight { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Smartsheet to Calendar Converter</h2>
    <textarea id="rawInput" placeholder="Paste your Smartsheet form raw data here..."></textarea>
    
    <div class="controls">
      <button onclick="generateCalendar()">Generate Calendar</button>
      <span>or upload file:</span>
      <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)" />
    </div>

    <div id="calendar" class="calendar-grid"></div>
  </div>

  <script>
    function parseData(text) {
      // Regex pattern to extract Day, Month, Date, and Selection Status
      const pattern = /(Sun|Mon|Tue|Wed|Thu|Fri|Sat),\s*([A-Za-z]+)\s*(\d+)([A-Za-z/]+)/g;
      const matches = [];
      let match;
      while ((match = pattern.exec(text)) !== null) {
        matches.push({ day: match[1], month: match[2], date: match[3], status: match[4] });
      }
      return matches;
    }

    function renderCalendar(items) {
      const calendarEl = document.getElementById("calendar");
      calendarEl.innerHTML = "";

      const daysOrder = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      
      // Render Day Headers
      daysOrder.forEach(day => {
        const header = document.createElement("div");
        header.className = "day-header";
        header.innerText = day;
        calendarEl.appendChild(header);
      });

      if (items.length === 0) return;

      // Fill leading blank days if first entry is not Sunday
      const firstDayIdx = daysOrder.indexOf(items[0].day);
      for (let i = 0; i < firstDayIdx; i++) {
        const empty = document.createElement("div");
        empty.className = "day-card";
        calendarEl.appendChild(empty);
      }

      // Render Days
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";
        card.innerHTML = `
          <div class="date-text">${item.month} ${item.date}</div>
          <div class="tag tag-${item.status}">${item.status}</div>
        `;
        calendarEl.appendChild(card);
      });
    }

    function generateCalendar() {
      const text = document.getElementById("rawInput").value;
      const items = parseData(text);
      renderCalendar(items);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("rawInput").value = e.target.result;
        generateCalendar();
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
